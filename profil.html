<!DOCTYPE html>
<html lang="tr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profili Görüntüle | Takasla</title>
    <link rel="stylesheet" href="styles.css">

    <!-- Leaflet Harita CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
</head>

<body>
    <!-- HEADER -->
    <header>
        <a href="/index.html" class="back-home-btn">Anasayfaya Dön</a>

        <h1>Takasla</h1>
        <div class="takas-pazari-link-container">
            <a href="/takas-pazari.html" class="takas-pazari-link">Takas Pazarlarını Görüntüle</a>
        </div>

        <nav class="search-bar">
            <div class="search-left">
                <form action="/results.html" method="GET">
                    <input type="text" name="query" placeholder="Ne arıyorsun?" required>

                    <select name="category" id="categorySelect">
                        <option value="">Tüm Kategoriler</option>
                    </select>

                    <select name="location" id="locationSelect">
                        <option value="">Şehir seçin</option>
                    </select>

                    <select name="district" id="districtSelect" disabled>
                        <option value="">İlçe seçin</option>
                    </select>

                    <select name="radius">
                        <option value="5">+5 km</option>
                        <option value="10">+10 km</option>
                        <option value="30">+30 km</option>
                    </select>

                    <button type="submit">Finden</button>
                </form>
            </div>
            <div class="search-right">
                <div class="profil-container" id="profilContainer">
                    <a href="#" class="profil-link" id="profilLink">
                        <i class="fas fa-user"></i> Profil
                    </a>
                    <ul class="dropdown-menu" id="dropdownMenu">
                        <li><a href="/register.html">Hesap Oluştur</a></li>
                        <li><a href="/login.html">Giriş Yap</a></li>
                        <li><a href="/profil.html">Profili Görüntüle</a></li>
                        <li><a href="/mesajlar.html">Mesajlar</a></li>
                        <li><a href="/ilanlarim.html">İlanlarım</a></li>
                    </ul>
                </div>
            </div>
        </nav>
    </header>

    <!-- MAIN -->
    <main class="profile-main">
        <!-- Kullanıcı Bilgisi Bölümü -->
        <section class="user-info">
            <div class="avatar-wrapper">
                <!-- Profil fotoğrafı varsa <img> kullanılır, yoksa harfli avatar -->
                <div class="avatar-placeholder">AA</div> <!-- Örn: Adnan Aksoy için -->
                <input type="file" id="uploadPhoto" accept="image/*" hidden>
                <button onclick="document.getElementById('uploadPhoto').click()">Fotoğraf Yükle</button>
            </div>
            <h2 class="user-name">Adnan Aksoy</h2>
        </section>

        <!-- Kullanıcı İlanları Bölümü -->
        <section class="user-ads">
            <!-- Eğer hiç ilan yoksa -->
            <div class="empty-ads">
                <i class="fas fa-trash fa-3x"></i>
                <p>Hiç takaslanacak ürünün yok mu?</p>
                <a href="/ilanver.html" class="ilan-ver-button">İlan Ver</a>
            </div>

            <!-- Eğer ilan varsa (bu kısım JS ile dinamik eklenebilir) -->
            <!--
        <div class="ad-card">
            <img src="urun.jpg" alt="Ürün görseli">
            <h3>Ürün Adı</h3>
            <p>Açıklama...</p>
        </div>
        -->
        </section>
    </main>

    <footer>
        <p class="copyright">Copyright 2025 Takasla</p>
    </footer>



    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const profilContainer = document.getElementById("profilContainer");
            const profilLink = document.getElementById("profilLink");

            profilLink.addEventListener("click", (e) => {
                e.preventDefault();
                profilContainer.classList.toggle("active");
            });

            // Sayfa dışına tıklanırsa menüyü kapat
            document.addEventListener("click", (e) => {
                if (!profilContainer.contains(e.target)) {
                    profilContainer.classList.remove("active");
                }
            });
        });
    </script>
</body>

</html>

</body>

</html>
